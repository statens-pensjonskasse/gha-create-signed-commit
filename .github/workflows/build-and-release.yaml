name: Build & Release

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-and-publish:
    uses: statens-pensjonskasse/public-actions-library/.github/workflows/build-action-node.yaml@1b9bc926ff226735b12a58c287542d73dc49371d # v0.3.9
    permissions:
      contents: write
      packages: write
    secrets: inherit
    with:
      node-version: '24'
