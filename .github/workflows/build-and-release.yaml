name: Build & Release

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-and-publish:
    uses: statens-pensjonskasse/public-actions-library/.github/workflows/build-action-node.yaml@b1509281d74a1afb44d9ceabfb361f8cf4bec420 # v0.3.6
    permissions:
      contents: write
      packages: write
    secrets: inherit
    with:
      node-version: '24'
