name: Build & Release

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-and-publish:
    uses: statens-pensjonskasse/public-actions-library/.github/workflows/build-action-node.yaml@4bbd47023c53914a01c3a99ee4a6b4703cafb143 # v0.3.10
    permissions:
      contents: write
      packages: write
    secrets: inherit
    with:
      node-version: '24'
