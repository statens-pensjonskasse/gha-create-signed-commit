name: Build & Release

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-and-publish:
    uses: statens-pensjonskasse/public-actions-library/.github/workflows/build-action-node.yaml@92853d2c2e1f5df9938ceeef916a0e0f6f326987 # v0.2.6
    permissions:
      contents: write
      packages: write
    secrets: inherit
    with:
      node-version: '24'
