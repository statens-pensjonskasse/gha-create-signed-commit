name: Build & Release

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-and-publish:
    uses: statens-pensjonskasse/public-actions-library/.github/workflows/build-action-node.yaml@2542126131d52bcac3e8d08fea5e85fc3e84911a # v0.3.7
    permissions:
      contents: write
      packages: write
    secrets: inherit
    with:
      node-version: '24'
