name: Build & Release

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-and-publish:
    uses: statens-pensjonskasse/public-actions-library/.github/workflows/build-action-node.yaml@04b1606a939935f7ef9b875107cfdd4776549dcb # v0.2.8
    permissions:
      contents: write
      packages: write
    secrets: inherit
    with:
      node-version: '24'
